name: Deploy Approved Subsites to aaPanel

on:
  push:
    branches: [main]
    paths:
      - "sites/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Sync changed site folders to aaPanel (159.89.94.209)
        env:
          DEPLOY_KEY: ${{ secrets.AAPANEL_DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H 159.89.94.209 >> ~/.ssh/known_hosts

          CHANGED_SITES=$(git diff --name-only HEAD~1 HEAD -- sites/ | cut -d/ -f2 | sort -u)
          for site in $CHANGED_SITES; do
            if [ -d "sites/$site" ]; then
              echo "Deploying $site -> /www/wwwroot/$site"
              rsync -avz --delete -e "ssh -i ~/.ssh/id_deploy" "sites/$site/" "deploy@159.89.94.209:/www/wwwroot/$site/"
            fi
          done
