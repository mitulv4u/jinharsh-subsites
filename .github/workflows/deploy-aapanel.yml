name: Deploy Approved Subsites to aaPanel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sites/**"
      - ".github/workflows/deploy-aapanel.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure SSH deploy key
        env:
          DEPLOY_KEY: ${{ secrets.AAPANEL_DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H 159.89.94.209 >> ~/.ssh/known_hosts

      - name: Sync git-sites.json on aaPanel (159.89.94.209)
        run: |
          python3 -c "import json, os; print(json.dumps(sorted([d for d in os.listdir('sites') if os.path.isdir(os.path.join('sites', d))])))" | ssh -i ~/.ssh/id_deploy deploy@159.89.94.209 "cat > /home/deploy/git-sites.json"

      - name: Sync changed site folders to aaPanel (159.89.94.209)
        run: |
          CHANGED_SITES=$(git diff --name-only HEAD~1 HEAD -- sites/ | cut -d/ -f2 | sort -u)
          for site in $CHANGED_SITES; do
            if [ -d "sites/$site" ]; then
              if [ "$site" = "catalog.jinharsh.com" ]; then
                echo "Deploying $site -> /www/wwwroot/$site/hub"
                rsync -rlvz --delete --no-perms --no-owner --no-group --omit-dir-times --exclude='.user.ini' --exclude='.well-known' --exclude='pdfs/' --exclude='data/' -e "ssh -i ~/.ssh/id_deploy" "sites/$site/" "deploy@159.89.94.209:/www/wwwroot/$site/hub/"
              elif [ "$site" = "rolltech.in" ]; then
                echo "Deploying $site -> /www/wwwroot/$site"
                rsync -rlvz --delete --no-perms --no-owner --no-group --omit-dir-times --exclude='.user.ini' --exclude='.well-known' --exclude='Groz_JCB/' --exclude='Catalogs/' --exclude='*.psd' -e "ssh -i ~/.ssh/id_deploy" "sites/$site/" "deploy@159.89.94.209:/www/wwwroot/$site/"
              elif [ "$site" = "rexnord.co.in" ]; then
                echo "Deploying $site -> /www/wwwroot/$site"
                rsync -rlvz --delete --no-perms --no-owner --no-group --omit-dir-times --exclude='.user.ini' --exclude='.well-known' --exclude='.git/' --exclude='*Catalogs*' --exclude='*Flyers*' --exclude='*flyers*' --exclude='Industrial Chains & Conveying components/' -e "ssh -i ~/.ssh/id_deploy" "sites/$site/" "deploy@159.89.94.209:/www/wwwroot/$site/"
              elif [ "$site" = "jinharsh.com" ]; then
                echo "Deploying $site -> /www/wwwroot/$site"
                rsync -rlvz --delete --no-perms --no-owner --no-group --omit-dir-times --exclude='.user.ini' --exclude='.well-known' --exclude='public/' -e "ssh -i ~/.ssh/id_deploy" "sites/$site/" "deploy@159.89.94.209:/www/wwwroot/$site/"
              elif [ "$site" = "hb-gamet.com" ]; then
                echo "Deploying $site -> /www/wwwroot/$site"
                rsync -rlvz --delete --no-perms --no-owner --no-group --omit-dir-times --exclude='.user.ini' --exclude='.well-known' --exclude='.venv/' --exclude='envato/' -e "ssh -i ~/.ssh/id_deploy" "sites/$site/" "deploy@159.89.94.209:/www/wwwroot/$site/"
              else
                echo "Deploying $site -> /www/wwwroot/$site"
                rsync -rlvz --delete --no-perms --no-owner --no-group --omit-dir-times --exclude='.user.ini' --exclude='.well-known' -e "ssh -i ~/.ssh/id_deploy" "sites/$site/" "deploy@159.89.94.209:/www/wwwroot/$site/"
              fi
            fi
          done
