<!DOCTYPE html>
<html class="ju" lang="en">
<head>
  <!-- synced via jinharsh-subsites -->
  <!-- Made from the Jinharsh Catalogues app (github.com/adi6499/PDFUPLOADER) by tools/php-hub/build.mjs: change it there.
       api.php, team.html, catalogs.json, pdfs/ and covers/ are this hub's own. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JINHARSH Catalog Hub — Interactive Industrial Catalogs &amp; PDF Downloads</title>
  <meta name="description" content="Official JINHARSH interactive catalog hub. View and download Timken, Regal Rexnord, Lovejoy, ABB, Groz, Dräger, and Flexco industrial catalogs.">
  <meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/hub/assets/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/hub/assets/apple-touch-icon.png">
  <!-- asked for straight away, while the rest of the page is still arriving: the list of catalogues, a catalogue
       page's cover picture, and only the scripts this page needs -->
  <script>
    window.CATALOGS_REQ = fetch('/hub/api.php?action=catalogs').then(function (r) { if (!r.ok) throw r; return r.json(); });
    window.CATALOGS_REQ.catch(function () {});
    (function () {
      var m = /[?&]cat=([A-Za-z0-9-]{1,120})(&|$)/.exec(location.search), h = document.head;
      function add(rel, href, as) { var l = document.createElement('link'); l.rel = rel; l.href = href; if (as) { l.as = as; l.setAttribute('fetchpriority', 'high'); } h.appendChild(l); }
      if (m) add('preload', '/hub/covers/' + m[1] + '.webp', 'image');
      (m ? ["/hub/js/boot.js","/hub/js/view.js","/hub/js/site.js","/hub/js/markup.js","/hub/js/backend.js","/hub/js/motion.js","/hub/js/particles.js","/hub/js/qr.js","/hub/js/copy.js","/hub/js/pdfkit.js","/hub/vendor/qrcode.js","/hub/vendor/icons.js?v=3","/hub/js/visitor.js","/hub/js/media.js","/hub/js/live.js","/hub/js/lookup.js","/hub/js/assistant.js","/hub/js/goodbye.js","/hub/js/peek.js"] : ["/hub/js/boot.js","/hub/js/hub.js","/hub/js/site.js","/hub/js/markup.js","/hub/js/backend.js","/hub/js/motion.js","/hub/js/particles.js","/hub/js/qr.js","/hub/js/copy.js","/hub/js/pdfkit.js","/hub/vendor/qrcode.js","/hub/vendor/icons.js?v=3","/hub/js/visitor.js","/hub/js/handoff.js","/hub/js/cardfx.js","/hub/js/peek.js","/hub/js/live.js","/hub/js/finder.js","/hub/js/lookup.js","/hub/js/assistant.js","/hub/js/goodbye.js"]).forEach(function (p) { add('modulepreload', p); });
    })();
  </script>
  <link rel="stylesheet" href="/hub/vendor/jinharsh-ui.css">
  <link rel="stylesheet" href="/hub/css/app.css">
  <link rel="stylesheet" href="/hub/css/view.css">
  <link rel="stylesheet" href="/hub/css/hub.css">
  <script src="/hub/js/theme-boot.js"></script>
  <script src="/hub/vendor/jinharsh-ui.js"></script>
  <link rel="preload" href="/hub/vendor/fonts/Geist-Latin.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body class="viewer">
<template id="t-view">
<header class="ju-top ju-glass">
    <div class="top-in">
      <button class="ju-icon" id="menuTop" type="button" aria-label="All catalogues" title="All catalogues"></button>
      <a class="brand" id="brand" href="/" rel="noopener">
        <img src="/hub/assets/mark-96.png" alt="" width="38" height="38">
        <span><b>Jinharsh</b><small>Industrial Solutions</small></span>
      </a>
      <button class="ju-icon" id="themeTop" type="button" aria-label="Light or dark" title="Light or dark"></button>
      <button class="ju-icon" id="shareTop" type="button" aria-label="Share" hidden></button>
    </div>
  </header>
  <main id="app" class="vwrap"></main>
</template>
<template id="t-hub">
<header class="ju-top ju-glass">
    <div class="top-in">
      <a class="brand" href="/">
        <img src="/hub/assets/mark-96.png" alt="" width="38" height="38">
        <span><b>Jinharsh</b><small>Catalogues</small></span>
      </a>
      <button class="ju-btn accent sm hub-upload" id="hubUpload" type="button" hidden></button>
      <button class="ju-icon" id="hubQr" type="button" aria-label="QR Studio: every QR code" title="QR Studio: every QR code"></button>
      <button class="ju-icon" id="themeTop" type="button" aria-label="Light or dark" title="Light or dark"></button>
      <button class="ju-icon" id="hubShare" type="button" aria-label="Share" title="Share"></button>
    </div>
  </header>
  <input type="file" id="hubFile" accept="application/pdf,.pdf" multiple hidden>
  <div class="drop-veil" id="dropVeil" hidden><div class="card"><span id="dropIcon"></span><b>Drop to upload</b><span class="ju-muted">PDF files only</span></div></div>
  <main class="vwrap" id="app">
    <section class="hub-hero">
      <div class="ju-eyebrow" id="hubEyebrow">Jinharsh Industrial Solutions</div>
      <h1>Catalogues</h1>
      <p class="lead">Every product catalogue in one place. Read it online, download it, or share it.</p>
      <label class="hub-search">
        <span class="sr">Search catalogues</span>
        <span id="searchIcon"></span>
        <input id="q" type="search" placeholder="Search: bearings, couplings, Timken…" autocomplete="off">
      </label>
    </section>
    <div class="chips" id="chips" role="group" aria-label="Brands"></div>
    <section class="cards" id="cards" aria-live="polite"></section>
    <div id="contact"></div>
  </main>
</template>
<script>
  // the frame of the page straight away: a catalogue (/?cat=<id>, with its cover) or the front page
  (function () {
    var m = /[?&]cat=([A-Za-z0-9-]{1,120})(&|$)/.exec(location.search), b = document.body, kind = m ? 'view' : 'hub';
    b.className = m ? 'viewer' : 'viewer hub';
    b.dataset.shell = kind;
    b.insertBefore(document.getElementById('t-' + kind).content.cloneNode(true), document.currentScript);
    if (m) document.getElementById('app').innerHTML = '<section class="v-hero"><div class="v-cover"><img src="/hub/covers/' + m[1] +
      '.webp" alt="" width="720" height="1018" fetchpriority="high" onerror="var s=this.closest(\'.v-hero\');if(s)s.remove()"></div></section>';
  })();
</script>
<script type="module" src="/hub/js/boot.js"></script>
</body>
</html>
