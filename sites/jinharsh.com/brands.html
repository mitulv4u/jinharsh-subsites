<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Brands | Jinharsh</title>
  <meta name="description" content="Authorized OEM Principals & Industrial Brands supplied by JinHarsh Industrial Solutions across India.">
  <meta property="og:title" content="Our Brands | Jinharsh">
  <meta property="og:description" content="Authorized OEM Principals & Industrial Brands supplied by JinHarsh Industrial Solutions across India.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.jinharsh.com/brands.html">
  <link rel="canonical" href="https://www.jinharsh.com/brands.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="js/data.js"></script>
  <script defer src="js/quote-cart.js"></script>
  <script defer src="js/components.js"></script>
</head>
<body class="flex flex-col min-h-screen bg-[var(--color-primary)] overflow-x-hidden">

  <div id="main-header"></div>

  <main class="flex-grow pt-20">
    <section class="py-16 bg-[#F8F8F8] border-b border-[#E7E7E7]">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center fade-in-up">
        <div class="inline-flex items-center gap-2 px-4 py-2 bg-white border border-[#E7E7E7] text-[var(--color-accent-dark)] text-sm font-bold uppercase tracking-widest mb-4 shadow-sm">
          Global Partners
        </div>
        <h1 class="text-4xl md:text-6xl font-black text-[#121212] uppercase tracking-tighter mb-4">
          Our Partner Brands
        </h1>
        <p class="text-base text-[#5a5a5a] max-w-2xl mx-auto font-light">
          We partner directly with world-class engineering manufacturers to bring you authorized, high-grade components.
        </p>
      </div>
    </section>

    <section class="py-16 bg-white">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div id="brands-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
          <!-- Dynamically filled by data.js -->
        </div>
      </div>
    </section>
  </main>

  <div id="main-footer"></div>
  <div id="floating-chat-container"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('brands-grid');
      if (grid && typeof catalogData !== 'undefined' && catalogData.brands) {
        grid.innerHTML = catalogData.brands.map(brand => `
          <div class="indust-card p-6 flex flex-col items-center text-center fade-in-up">
            <div class="h-24 w-48 flex items-center justify-center mb-4 bg-gray-50 border border-[#E7E7E7] p-4 rounded">
              <img src="${brand.image}" alt="${brand.name}" class="max-h-full max-w-full object-contain" onerror="this.src='public/images/catalog/homepage.png'" />
            </div>
            <h3 class="text-xl font-bold text-[#121212] uppercase mb-2">${brand.name}</h3>
            <p class="text-xs text-[#5a5a5a] font-light line-clamp-3 mb-6 flex-grow">${brand.desc || ''}</p>
            <a href="brand.html?slug=${brand.slug}" class="indust-button w-full py-2 text-xs font-bold uppercase">
              View Products & Line →
            </a>
          </div>
        `).join('');
      }
    });
  </script>
</body>
</html>
