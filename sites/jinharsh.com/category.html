  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const catId = urlParams.get('id') || urlParams.get('category');

      if (!catId || typeof catalogData === 'undefined') return;

      const category = catalogData.categories.find(c => c.id === catId);
      if (!category) {
        document.getElementById('category-header').innerHTML = `<div class="text-center text-red-500 font-bold py-12">Category not found.</div>`;
        return;
      }

      document.title = `${category.title} | Jinharsh`;

      document.getElementById('category-header').innerHTML = `
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div class="inline-block bg-[var(--color-accent)] text-[#121212] text-xs font-bold px-3 py-1 uppercase mb-4">Category Overview</div>
          <h1 class="text-3xl md:text-5xl font-black text-[#121212] uppercase mb-4">${category.title}</h1>
          <p class="text-[#5a5a5a] text-base max-w-3xl font-light">${category.desc || ''}</p>
        </div>
      `;

      const grid = document.getElementById('products-grid');
      if (category.products && category.products.length > 0) {
        grid.innerHTML = category.products.map(prod => `
          <div class="indust-card p-6 flex flex-col justify-between bg-white border border-[#E7E7E7]">
            <div>
              <div class="h-48 w-full bg-gray-50 mb-4 flex items-center justify-center p-4 rounded overflow-hidden">
                <img src="${jhImg(prod.image)}" alt="${prod.name}" class="max-h-full max-w-full object-contain" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='public/images/catalog/homepage.webp'" />
              </div>
              <h4 class="text-lg font-bold text-[#121212] uppercase mb-2">${prod.name}</h4>
              <div class="text-xs text-[#5a5a5a] mb-4">
                <span class="font-bold">Available Brands:</span> ${(prod.brands && prod.brands.length) ? prod.brands.join(', ') : 'Various Brands'}
              </div>
            </div>
            <div class="space-y-2 mt-4">
              <a href="product.html?category=${category.id}&slug=${prod.slug}" class="block text-center text-xs font-bold text-[var(--color-accent)] hover:underline uppercase py-1">
                View Specifications →
              </a>
              <button onclick="handleAddToCart('${prod.name.replace(/'/g, "\\'")}', '${category.title.replace(/'/g, "\\'")}', '${(prod.brands && prod.brands[0]) ? prod.brands[0] : 'Generic'}', 'public${prod.image}', '${prod.slug}')" class="indust-button w-full py-2.5 text-xs font-bold uppercase">
                + Add to Quote
              </button>
            </div>
          </div>
        `).join('');
      } else {
        grid.innerHTML = `<div class="col-span-full text-center text-[#5a5a5a] py-8">No products listed under this category yet.</div>`;
      }
    });

    function handleAddToCart(name, category, brand, image, slug) {
      addToQuote(name, category, brand, image, slug);
      alert(`${name} added to your quote request cart!`);
    }
  </script>
