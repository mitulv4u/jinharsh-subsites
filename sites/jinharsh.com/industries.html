<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Industries We Serve | Jinharsh</title>
  <meta name="description" content="Industries Served — Steel, Cement, Power, Mining, Oil & Gas, Paper, Marine, Chemical & Heavy Engineering.">
  <meta property="og:title" content="Industries We Serve | Jinharsh">
  <meta property="og:description" content="Industries Served — Steel, Cement, Power, Mining, Oil & Gas, Paper, Marine, Chemical & Heavy Engineering.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.jinharsh.com/industries.html">
  <link rel="canonical" href="https://www.jinharsh.com/industries.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="js/data.js"></script>
  <script defer src="js/quote-cart.js"></script>
  <script defer src="js/components.js"></script>
</head>
<body class="flex flex-col min-h-screen bg-[var(--color-primary)] overflow-x-hidden">

  <div id="main-header"></div>

  <main class="flex-grow pt-20">
    <section class="py-16 bg-[#F8F8F8] border-b border-[#E7E7E7]">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center fade-in-up">
        <div class="inline-flex items-center gap-2 px-4 py-2 bg-white border border-[#E7E7E7] text-[var(--color-accent-dark)] text-sm font-bold uppercase tracking-widest mb-4 shadow-sm">
          Our Expertise
        </div>
        <h1 class="text-4xl md:text-6xl font-black text-[#121212] uppercase tracking-tighter mb-4">
          Industries We Serve
        </h1>
        <p class="text-base text-[#5a5a5a] max-w-2xl mx-auto font-light">
          Providing specialized power transmission and engineering solutions across 15 core industrial sectors.
        </p>
      </div>
    </section>

    <section class="py-16 bg-white">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div id="industries-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
          <!-- Injected via script -->
        </div>
      </div>
    </section>
  </main>

  <div id="main-footer"></div>
  <div id="floating-chat-container"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('industries-grid');
      if (grid && typeof companyData !== 'undefined' && companyData.industries) {
        grid.innerHTML = companyData.industries.map(ind => `
          <div class="indust-card flex flex-col bg-white border border-[#E7E7E7] overflow-hidden fade-in-up">
            <div class="relative h-48 bg-gray-100">
              <img src="public${ind.image}" alt="${ind.name}" class="object-cover w-full h-full" onerror="this.src='public/images/catalog/homepage.png'" />
            </div>
            <div class="p-6 flex-grow flex flex-col">
              <h3 class="text-xl font-bold text-[#121212] uppercase mb-2">${ind.name}</h3>
              <p class="text-xs text-[#5a5a5a] font-light leading-relaxed flex-grow">${ind.desc}</p>
              <a href="contact.html" class="mt-4 text-xs font-bold text-[var(--color-accent)] uppercase hover:underline">
                Inquire Sector Solutions →
              </a>
            </div>
          </div>
        `).join('');
      }
    });
  </script>
</body>
</html>
