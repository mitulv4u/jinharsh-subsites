<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Portfolio | Jinharsh</title>
  <meta name="description" content="JinHarsh Industrial Product Portfolio — Bearings, Power Transmission, Lubrication, Safety & Maintenance Solutions.">
  <meta property="og:title" content="Product Portfolio | Jinharsh">
  <meta property="og:description" content="JinHarsh Industrial Product Portfolio — Bearings, Power Transmission, Lubrication, Safety & Maintenance Solutions.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.jinharsh.com/portfolio.html">
  <link rel="canonical" href="https://www.jinharsh.com/portfolio.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="js/data.js"></script>
  <script defer src="js/quote-cart.js"></script>
  <script defer src="js/components.js"></script>
</head>
<body class="flex flex-col min-h-screen bg-[var(--color-primary)] overflow-x-hidden">

  <div id="main-header"></div>

  <main class="flex-grow pt-20">
    <section class="py-16 bg-[#F8F8F8] border-b border-[#E7E7E7]">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center fade-in-up">
        <div class="inline-flex items-center gap-2 px-4 py-2 bg-white border border-[#E7E7E7] text-[var(--color-accent-dark)] text-sm font-bold uppercase tracking-widest mb-4 shadow-sm">
          Comprehensive Range
        </div>
        <h1 class="text-4xl md:text-6xl font-black text-[#121212] uppercase tracking-tighter mb-4">
          Product Portfolio
        </h1>
        <p class="text-base text-[#5a5a5a] max-w-2xl mx-auto font-light">
          Browse our extensive catalog of power transmission, bearings, lubrication, and industrial automation equipment.
        </p>
      </div>
    </section>

    <section class="py-16 bg-white">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div id="categories-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
          <!-- Dynamically filled by script below -->
        </div>
      </div>
    </section>
  </main>

  <div id="main-footer"></div>
  <div id="floating-chat-container"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('categories-grid');
      if (grid && typeof catalogData !== 'undefined' && catalogData.categories) {
        grid.innerHTML = catalogData.categories.map((cat, idx) => `
          <div class="indust-card group flex flex-col h-full bg-white border border-[#E7E7E7] overflow-hidden fade-in-up">
            <div class="relative w-full h-56 overflow-hidden bg-gray-100">
              <img src="public${cat.image}" alt="${cat.title}" class="object-cover w-full h-full group-hover:scale-105 transition-transform duration-500" onerror="this.src='public/images/catalog/homepage.png'" />
              <div class="absolute top-4 left-4 bg-[var(--color-accent)] px-3 py-1 text-[#121212] text-lg font-black shadow-sm">
                0${idx + 1}
              </div>
            </div>
            <div class="p-8 flex flex-col flex-grow">
              <h3 class="text-xl font-bold text-[#121212] uppercase mb-3 group-hover:text-[var(--color-accent-dark)] transition-colors">
                ${cat.title}
              </h3>
              <p class="text-[#5a5a5a] text-sm font-light leading-relaxed mb-6 flex-grow">
                ${cat.desc || ''}
              </p>
              <a href="category.html?id=${cat.id}" class="indust-button w-full py-3 text-xs font-bold uppercase mt-auto">
                Explore Category →
              </a>
            </div>
          </div>
        `).join('');
      }
    });
  </script>
</body>
</html>
