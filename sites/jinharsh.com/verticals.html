<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Verticals | Jinharsh</title>
  <meta name="description" content="JinHarsh Business Verticals — Distribution, Supply Aggregation, Engineering Solutions & Field Services.">
  <meta property="og:title" content="Business Verticals | Jinharsh">
  <meta property="og:description" content="JinHarsh Business Verticals — Distribution, Supply Aggregation, Engineering Solutions & Field Services.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.jinharsh.com/verticals.html">
  <link rel="canonical" href="https://www.jinharsh.com/verticals.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="js/data.js"></script>
  <script defer src="js/quote-cart.js"></script>
  <script defer src="js/components.js"></script>
</head>
<body class="flex flex-col min-h-screen bg-[var(--color-primary)] overflow-x-hidden">

  <div id="main-header"></div>

  <main class="flex-grow pt-20">
    <section class="py-16 bg-[#F8F8F8] border-b border-[#E7E7E7]">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center fade-in-up">
        <div class="inline-flex items-center gap-2 px-4 py-2 bg-white border border-[#E7E7E7] text-[var(--color-accent-dark)] text-sm font-bold uppercase tracking-widest mb-4 shadow-sm">
          Our Divisions
        </div>
        <h1 class="text-4xl md:text-6xl font-black text-[#121212] uppercase tracking-tighter mb-4">
          Business Verticals
        </h1>
        <p class="text-base text-[#5a5a5a] max-w-2xl mx-auto font-light">
          Organized into specialized divisions to handle services, supply aggregation, engineering, trading, and distribution.
        </p>
      </div>
    </section>

    <section class="py-16 bg-white">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div id="verticals-list" class="space-y-8">
          <!-- Injected via script -->
        </div>
      </div>
    </section>
  </main>

  <div id="main-footer"></div>
  <div id="floating-chat-container"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const list = document.getElementById('verticals-list');
      if (list && typeof companyData !== 'undefined' && companyData.verticals) {
        list.innerHTML = companyData.verticals.map((vert, idx) => `
          <div class="indust-card flex flex-col md:flex-row bg-white border border-[#E7E7E7] border-l-4 border-l-[var(--color-accent)] overflow-hidden fade-in-up">
            <div class="md:w-1/3 h-56 md:h-auto bg-gray-100 relative">
              <img src="public${vert.image}" alt="${vert.name}" class="object-cover w-full h-full" onerror="this.src='public/images/catalog/homepage.png'" />
            </div>
            <div class="p-8 flex-1 flex flex-col justify-between">
              <div>
                <div class="text-xs font-bold text-[var(--color-accent)] uppercase mb-1">Division 0${idx + 1}</div>
                <h2 class="text-2xl font-black text-[#121212] uppercase mb-4">${vert.name}</h2>
                <p class="text-sm text-[#5a5a5a] font-light leading-relaxed mb-6">${vert.desc}</p>
              </div>
              <div>
                <a href="${idx === 4 ? 'brands.html' : (idx === 2 ? 'portfolio.html' : 'contact.html')}" class="indust-button px-6 py-2.5 text-xs font-bold uppercase">
                  ${idx === 4 ? 'View Principals →' : (idx === 2 ? 'View Products →' : 'Inquire Division →')}
                </a>
              </div>
            </div>
          </div>
        `).join('');
      }
    });
  </script>
</body>
</html>
